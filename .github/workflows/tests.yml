name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@31be9bf07155154cfce850e9d4133b502ee6f023 # v5.3.0
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      dependency-manager: 'uv'
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
