name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  tests:
    permissions:
      contents: read
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@42b61e053c1d70a61deb42b323c1a2229e2e7fe0 # v5.5.0
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]'
      dependency-manager: 'uv'
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
