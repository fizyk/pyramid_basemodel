[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12,<0.13" ]

[project]
name = "pyramid-basemodel"
version = "0.7.0"
description = "pyramid_basemodel - a thin, low level SQLAlchemy bindings to pyramid"
readme = "README.rst"
keywords = [ "pyramid", "sqlalchemy" ]
license = { file = "UNLICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Pyramid",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: The Unlicense (Unlicense)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Front-Ends",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "inflect",
    "pyramid",
    "pyramid-tm",
    "python-slugify",
    "requests",
    "sqlalchemy>=2",
    "zope-interface",
    "zope-sqlalchemy",
]

[[project.authors]]
name = "James Arthur"

[[project.maintainers]]
name = "Grzegorz Śliwiński"
email = "fizyk+pypi@fizyk.dev"

[project.urls]
Source = "https://github.com/fizyk/pyramid_basemodel/"
"Bug Tracker" = "https://github.com/fizyk/pyramid_basemodel/issues"
Changelog = "https://github.com/fizyk/pyramid_basemodel/blob/v0.7.0/CHANGES.rst"

[dependency-groups]
dev = [
    "coverage==7.15.4",
    "inflect==7.5.0",
    "mock==5.2.0",
    "mypy==2.3.0; implementation_name=='cpython'",
    "pyramid==2.1.0",
    "pyramid-tm==2.6",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "python-slugify==8.0.4",
    "requests==2.34.2",
    "requests-mock==1.12.1",
    "sqlalchemy==2.0.51",
    "types-mock==5.2.0.20260518",
    "zope-interface==8.5",
    "zope-sqlalchemy==4.1",
]
release = [
    "tbump==6.11.0",
    "towncrier==25.8.0",
]

[tool.uv.build-backend]
module-name = "pyramid_basemodel"
module-root = ""
source-include = [ "CHANGES.rst" ]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "D", # pydocstyle
]

[tool.pyproject-fmt]
column_width = 120
indent = 4
keep_full_version = true
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"

[tool.mypy]
exclude = [ "^\\.venv/" ]
ignore_missing_imports = false
follow_imports = "silent"
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true
allow_untyped_globals = false
allow_redefinition = false
implicit_reexport = false
strict_equality = true
pretty = true
no_implicit_optional = true
show_error_codes = true

# Neither pyramid nor the zope packages ship a py.typed marker, and no stub
# distributions exist for them on PyPI.
[[tool.mypy.overrides]]
module = [ "pyramid.*", "zope.*" ]
ignore_missing_imports = true

# zope.interface.Interface is untyped, so the marker interfaces necessarily
# subclass Any.
[[tool.mypy.overrides]]
module = [ "pyramid_basemodel.interfaces" ]
disallow_subclassing_any = false

[tool.pytest]
strict_xfail = true

[tool.tbump]

[[tool.tbump.before_commit]]
name = "Build changelog"
cmd = "uv run towncrier build --version {new_version} --yes"

[[tool.tbump.field]]
# the name of the field
name = "extra"
# the default value to use, if there is no match
default = ""

[[tool.tbump.file]]
src = "pyramid_basemodel/__init__.py"

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'version = "{current_version}"'

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'Changelog = "https://github.com/fizyk/pyramid_basemodel/blob/v{current_version}/CHANGES.rst"'

[tool.tbump.git]
message_template = "Release {new_version}"
tag_template = "v{new_version}"

[tool.tbump.version]
current = "0.7.0"
# Example of a semver regexp.
# Make sure this matches current_version before
# using tbump
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (\-
    (?P<extra>.+)
  )?
  '''

[tool.towncrier]
directory = "newsfragments"
filename = "CHANGES.rst"
issue_format = "`#{issue} <https://github.com/fizyk/pyramid_basemodel/issues/{issue}>`_"
single_file = true

[[tool.towncrier.type]]
directory = "break"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "depr"
name = "Deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous"
showcontent = true
